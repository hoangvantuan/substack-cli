# Publishes substackctl to npm with provenance attestation when a version tag
# is pushed.
#
# STATUS: written but NEVER RUN. Publishing was deliberately deferred by the
# user: no NPM_TOKEN secret has been configured in this repository yet, and no
# v* tag has been pushed. When ready to release for real:
#
#   1. Create an npm account and verify its email address.
#   2. Confirm the intended login: npm whoami.
#   3. Create an automation/granular access token on npmjs.com and add it as
#      the NPM_TOKEN secret in GitHub (Settings > Secrets and variables >
#      Actions).
#   4. Tag and push: git tag v0.1.0 && git push origin v0.1.0
#
# This workflow then claims the package name with a placeholder release; every
# later release is just another tag push.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token, required for npm provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
