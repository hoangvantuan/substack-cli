# Publishes @tuanhv/sub-cli to npm via trusted publishing (OIDC) when a version
# tag is pushed. Provenance attestations are generated automatically.
#
# One-time setup on npmjs.com (needs the package to exist, so it bootstrapped
# with a manual publish first): package Settings > Trusted publishing >
# GitHub Actions with repository hoangvantuan/substack-cli, workflow filename
# release.yml, allow "npm publish". No npm token secret is involved.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token, required for npm provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false # never use caching in release builds
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
